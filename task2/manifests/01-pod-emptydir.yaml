# Задание 2, п. 6: создание тома (Volume) и его монтирование в pod.
#
# Демонстрируется самый показательный случай — том emptyDir, смонтированный
# в ДВА контейнера одного пода:
#   * writer  — пишет строки в /data/log.txt и дублирует их в /data/index.html;
#   * reader  — nginx раздаёт тот же каталог как корень сайта (/usr/share/nginx/html).
# Если том действительно общий, содержимое, записанное в writer, видно в reader.
#
# emptyDir живёт столько же, сколько pod: удалили pod — данные пропали
# (для сохранения данных используется PVC, см. 02-pvc.yaml и 03-pod-pvc.yaml).
apiVersion: v1
kind: Pod
metadata:
  name: volume-demo
  namespace: lab4-task2
  labels:
    app: volume-demo
    lab: "4"
spec:
  containers:
    - name: writer
      image: python:3.12.1-alpine
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
        - |
          i=0
          while true; do
            i=$((i+1))
            line="record $i from $HOSTNAME at $(date +%Y-%m-%dT%H:%M:%S)"
            echo "$line" >> /data/log.txt
            cp /data/log.txt /data/index.html
            sleep 5
          done
      volumeMounts:
        - name: shared-data
          mountPath: /data
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
    - name: reader
      image: nginx:alpine
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
          readOnly: true
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
  volumes:
    - name: shared-data
      emptyDir:
        sizeLimit: 64Mi
